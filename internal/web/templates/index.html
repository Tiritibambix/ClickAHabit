{{ define "index.html" }}
</head>
<script src="/fs/public/js/index.js"></script>
<body id="indexBody">
<div class="container-lg">
  <div class="date-bar my-3">
    <div class="d-flex align-items-center justify-content-between gap-2">
      <div class="form-switch ms-1">
        <input class="form-check-input" type="checkbox" onclick='toggleTabname()' title="Daily/Weekly" aria-label="Switch between daily and weekly habits">
      </div>
      <div class="d-flex align-items-center gap-2 flex-grow-1 justify-content-center">
        <button onclick='setFormDate(-1)' class="btn tr-button px-2" aria-label="Previous day"><i class="bi bi-chevron-left" aria-hidden="true"></i></button>
        <input type="date" class="form-control form-control-sm text-center" onchange='setFormDate()' id="realDate" style="max-width:160px;" aria-label="Selected date">
        <button onclick='setFormDate(+1)' class="btn tr-button px-2" aria-label="Next day"><i class="bi bi-chevron-right" aria-hidden="true"></i></button>
        <button onclick='updatePlan()' class="btn tr-button px-2" title="Sync plan" aria-label="Sync plan"><i class="bi bi-arrow-clockwise" aria-hidden="true"></i></button>
      </div>
      <button onclick='toggleLayout()' class="btn tr-button me-1 d-none d-md-block" title="Toggle layout" aria-label="Toggle layout">
        <i class="bi bi-layout-wtf" aria-hidden="true"></i>
      </button>
    </div>
  </div>
  <div id="checkList">
  </div>
</div>
<script>
  setToday();
</script>

<!-- Cost entry modal -->
<div class="modal fade" id="costModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h6 class="modal-title">Amount (€)</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body py-2">
        <label for="costInput" class="form-label small text-muted">How much did this cost?</label>
        <input type="number" id="costInput" class="form-control" step="0.01" min="0" placeholder="0.00" inputmode="decimal">
      </div>
      <div class="modal-footer py-1">
        <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-sm btn-primary" id="costConfirm">OK</button>
      </div>
    </div>
  </div>
</div>

{{ template "footer.html" }}
{{ end }}
