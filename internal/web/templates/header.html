{{ define "header.html"}}

<!DOCTYPE html>
<html lang="en" data-bs-theme="{{ .Config.Color }}" data-accent="{{ .Config.Theme }}">
<head>
    <title>Click A Habit</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/fs/public/favicon.png">
    {{ if eq .Config.NodePath "" }}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@2.0.1"></script>
    {{ else }}
    <link rel="stylesheet" href="{{ .Config.NodePath }}/node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link href="{{ .Config.NodePath }}/node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="{{ .Config.NodePath }}/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ .Config.NodePath }}/node_modules/chart.js/dist/chart.umd.js"></script>
    <script src="{{ .Config.NodePath }}/node_modules/chartjs-chart-matrix/dist/chartjs-chart-matrix.min.js"></script>
    {{ end }}
</head>
<link rel="stylesheet" type="text/css" href="/fs/public/css/index.css" />
<script src="/fs/public/js/theme.js"></script>
<body>
  <nav class="navbar navbar-expand-sm app-navbar py-1">
    <div class="container-lg">
      <a class="app-brand py-0" href="/">
        <img src="/fs/public/favicon.png" alt="">
        <span class="d-none d-sm-inline">Click A Habit</span>
      </a>
      <div class="d-flex align-items-center gap-2 order-sm-last">
        <button type="button" class="theme-toggle" id="themeToggle" title="Toggle light/dark" aria-label="Toggle light/dark theme">
          <i class="bi bi-moon-stars-fill" id="themeToggleIcon" aria-hidden="true"></i>
        </button>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto mb-0 mt-2 mt-sm-0">
          <li class="nav-item">
            <a class="nav-link" data-nav="today" href="/"><i class="bi bi-check2-circle" aria-hidden="true"></i>Today</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-nav="add" data-nav-match="/planedit/" href="/planedit/new"><i class="bi bi-plus-circle" aria-hidden="true"></i>Add</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-nav="plan" href="/plan/"><i class="bi bi-list-check" aria-hidden="true"></i>Plan</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-nav="stats" href="/stats/checks/total"><i class="bi bi-bar-chart-line" aria-hidden="true"></i>Stats</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-nav="config" href="/config/"><i class="bi bi-gear" aria-hidden="true"></i>Config</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
{{ end }}
