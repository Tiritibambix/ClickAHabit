{{ define "plan.html" }}

<body>
    <div class="container-lg mt-4">
        <div class="card border-primary">
            <div class="card-header d-flex align-items-center justify-content-between">
                <h5 class="mb-0"><i class="bi bi-list-check me-2" aria-hidden="true"></i>Plan</h5>
                <a href="/planedit/new" class="btn btn-sm btn-primary"><i class="bi bi-plus-circle me-1" aria-hidden="true"></i>Add habit</a>
            </div>
            <div class="card-body table-responsive p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th style="width:1%;"></th>
                            <th style="width:1%;">Icon</th>
                            <th>Group</th>
                            <th>Name</th>
                            <th class="text-center">Weekly</th>
                            <th class="text-center">Paused</th>
                            <th>Place</th>
                            <th style="width:1%;"></th>
                        </tr>
                    </thead>
                    <tbody>
                        {{ range .Plans }}
                        <tr>
                            <td>
                                <i class="bi bi-square-fill" style="color: {{ .Color }};" aria-hidden="true"></i>
                            </td>
                            <td>
                                {{ if .Icon }}<img src="{{ .Icon }}" style="height:1.3em;" alt="" onerror="this.style.display='none';">{{ end }}
                            </td>
                            <td class="text-secondary">{{ .Group }}</td>
                            <td class="fw-semibold">{{ .Name }}</td>
                            <td class="text-center">{{ if .Weekly }}<i class="bi bi-check-lg text-primary" aria-label="Weekly"></i>{{ end }}</td>
                            <td class="text-center">{{ if .Pause }}<i class="bi bi-pause-circle text-secondary" aria-label="Paused"></i>{{ end }}</td>
                            <td class="text-secondary">{{ .Place }}</td>
                            <td class="text-end text-nowrap">
                                <a href="/planedit/{{ .ID }}" class="tr-button" title="Edit" aria-label="Edit {{ .Name }}">
                                    <i class="bi bi-pencil-square" aria-hidden="true"></i>
                                </a>
                                <a href="/plandel/{{ .ID }}" class="tr-button" title="Delete" aria-label="Delete {{ .Name }}" onclick="return confirm('Delete \'{{ .Name }}\'? This cannot be undone.');">
                                    <i class="bi bi-trash3" aria-hidden="true"></i>
                                </a>
                            </td>
                        </tr>
                        {{ end }}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

{{ template "footer.html" }}
{{ end }}
