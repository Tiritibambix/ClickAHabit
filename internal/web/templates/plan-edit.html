{{ define "plan-edit.html" }}

<body>
    <div class="container-lg mt-4">
        <div class="row g-3">
            <div class="col-lg-8">
                <div class="card border-primary">
                    <div class="card-header">
                        <h5 class="mb-0">{{ if .OnePlan.ID }}Edit habit{{ else }}New habit{{ end }}</h5>
                    </div>
                    <div class="card-body">
                        <form action="/planedit/" method="post">
                            <input name="id" type="hidden" value="{{ .OnePlan.ID }}">

                            <div class="row g-3 mb-3">
                                <div class="col-sm-6">
                                    <label for="f-group" class="form-label small text-muted">Group</label>
                                    <input id="f-group" name="group" type="text" class="form-control" value="{{ .OnePlan.Group }}" required>
                                </div>
                                <div class="col-sm-6">
                                    <label for="f-name" class="form-label small text-muted">Name</label>
                                    <input id="f-name" name="name" type="text" class="form-control" value="{{ .OnePlan.Name }}" required>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-sm-6">
                                    <label class="form-label small text-muted">Color</label>
                                    <div class="d-flex align-items-center gap-3">
                                        <input name="color" value="{{ .OnePlan.Color }}" type="color" class="form-control form-control-color" title="Accent color for this habit's tile">
                                        <div class="form-check form-switch mb-0">
                                            <input name="nocolor" value="yes" class="form-check-input" type="checkbox" id="f-nocolor" {{ if .OnePlan.NoColor }}checked{{ end }}>
                                            <label class="form-check-label small" for="f-nocolor">No color</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <label for="f-place" class="form-label small text-muted">Place (sort order)</label>
                                    <input id="f-place" name="place" type="number" class="form-control" value="{{ .OnePlan.Place }}">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="f-icon" class="form-label small text-muted">Icon URL</label>
                                <input id="f-icon" name="icon" type="text" class="form-control" value="{{ .OnePlan.Icon }}" placeholder="https://…/icon.png">
                            </div>

                            <div class="mb-4">
                                <label for="f-link" class="form-label small text-muted">Link</label>
                                <input id="f-link" name="link" type="url" class="form-control" value="{{ .OnePlan.Link }}" placeholder="https://…">
                                <div class="form-text">Shown in the tile's right-click menu as "Open Link in a New Tab".</div>
                            </div>

                            <div class="d-flex flex-wrap gap-4 mb-4">
                                <div class="form-check form-switch mb-0">
                                    <input name="pause" value="yes" class="form-check-input" type="checkbox" id="f-pause" {{ if .OnePlan.Pause }}checked{{ end }}>
                                    <label class="form-check-label" for="f-pause">Pause</label>
                                </div>
                                <div class="form-check form-switch mb-0">
                                    <input name="weekly" value="yes" class="form-check-input" type="checkbox" id="f-weekly" {{ if .OnePlan.Weekly }}checked{{ end }}>
                                    <label class="form-check-label" for="f-weekly">Weekly</label>
                                </div>
                                <div class="form-check form-switch mb-0">
                                    <input name="hascost" value="yes" class="form-check-input" type="checkbox" id="f-hascost" {{ if .OnePlan.HasCost }}checked{{ end }}>
                                    <label class="form-check-label" for="f-hascost">Has cost</label>
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check2 me-1" aria-hidden="true"></i>Save</button>
                                <a href="/plan/" class="btn btn-outline-secondary px-4">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card border-secondary h-100">
                    <div class="card-header">
                        <h6 class="mb-0 fw-semibold">Icon preview</h6>
                    </div>
                    <div class="card-body d-flex align-items-center justify-content-center text-center" style="min-height: 160px;">
                        {{ if .OnePlan.Icon }}
                        <img src="{{ .OnePlan.Icon }}" style="max-width:100%;max-height:120px;" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'text-muted small',textContent:'Could not load this icon URL'}));">
                        {{ else }}
                        <div class="text-muted small">No icon set</div>
                        {{ end }}
                    </div>
                </div>
            </div>
        </div>
    </div>

{{ template "footer.html" }}
{{ end }}
